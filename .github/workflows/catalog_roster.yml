name: Catalog Roster (新 MPQ 名冊逐步填寫)

# 2026-11-24 Jun「照範圍做」：新 MPQ 名冊（證券名冊 v3 起，本地端 ADR-078 格式的數據中心欄），每天一段慢慢填。
# 錯開正式作業：腳本開始前與每查 20 支看 raw_writer_daily／nightly_chain／listing_events／bc_tickets，有在跑就寫回進度後結束
# （GitHub 排程常遲到數小時，不靠排程時間錯開）。結果只寫私有 dataset _catalog/symbols/；公開日誌只印數量。
# 登記：MongoDB_Standard_v3 2026-11-24 條。

on:
  schedule:
    - cron: "0 2 * * *"      # 每日 02:00 UTC（實際可能遲到；遇正式作業自動讓路）
  workflow_dispatch:
    inputs:
      budget_min:
        description: "逐支查最多跑幾分鐘"
        required: false
        default: "300"
      force_bulk:
        description: "1＝重抓三份總表重做 bulk"
        required: false
        default: "0"
      publish:
        description: "auto＝查完或週日才發布｜yes＝這次就發布｜no＝不發布"
        required: false
        default: "auto"
      dry_run:
        description: "1＝試跑（不寫 dataset）"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read        # 看正式作業有沒有在跑（讓路用）

concurrency:
  # 2026-10-18 Jun：GitHub 三條線；臨時任務共用 temp-line，同時最多一個
  group: temp-line
  cancel-in-progress: false

jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline tests
        run: python tests/test_catalog_roster.py && python tests/test_catalog_symbols.py && python tests/test_listing_events.py

      - name: Install dependencies
        run: pip install requests pytz huggingface_hub

      - name: Roster
        env:
          POLYGON_KEY:      ${{ secrets.POLYGON_KEY }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:       ${{ secrets.HF_REPO_ID }}
          GITHUB_TOKEN:     ${{ github.token }}
          IN_BUDGET:        ${{ github.event.inputs.budget_min || '300' }}
          IN_FORCE:         ${{ github.event.inputs.force_bulk || '0' }}
          IN_PUBLISH:       ${{ github.event.inputs.publish || 'auto' }}
          IN_DRY:           ${{ github.event.inputs.dry_run || '0' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if ! [[ "$IN_BUDGET" =~ ^[0-9]{1,3}$ ]] || [ "$IN_BUDGET" -gt 310 ]; then echo "budget_min 要 0～310"; exit 1; fi
          case "$IN_PUBLISH" in auto|yes|no) ;; *) echo "publish 只能 auto／yes／no"; exit 1;; esac
          ARGS="--budget-min $IN_BUDGET --publish $IN_PUBLISH"
          [ "$IN_FORCE" = "1" ] && ARGS="$ARGS --force-bulk"
          [ "$IN_DRY" = "1" ] && ARGS="$ARGS --dry-run"
          python catalog_roster.py $ARGS
