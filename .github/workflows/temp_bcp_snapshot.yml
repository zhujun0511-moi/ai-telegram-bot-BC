name: TEMP · Snapshot Daily Archive + Trim (SIGNAL_SNAPSHOTS)

# ⚠️⚠️ 臨時 workflow（2026-09-23）：BC.p 帳單被擋期間，搬來公開 BC 頂著。
# 帳單修好後整包刪除 bcp_temp/ + temp_bcp_*.yml，BC.p 恢復。CFET 不在此列。
# 腳本從 BC.p 逐字複製、跑同一 Mongo、marker 冪等。

on:
  schedule:
    - cron: "0 7 * * *"    # 同 BC.p 原排程 ~02:00-03:00 EST
  workflow_dispatch:
    inputs:
      mode:
        description: "full=封存+裁切 / dry_run=只算不寫不刪"
        required: false
        default: "full"
      ignore_marker:
        description: "true=忽略今日 marker 強制重算（補跑用）"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: temp-bcp-snapshot-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snapshot_archive (SIGNAL_SNAPSHOTS -> dataset + trim Mongo)
        working-directory: bcp_temp
        env:
          MONGO_URI:        ${{ secrets.MONGO_URI }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:       ${{ secrets.HF_REPO_ID }}
          PYTHONUNBUFFERED: "1"
          MODE:             ${{ github.event.inputs.mode || 'full' }}
          IGNORE_MARKER:    ${{ github.event.inputs.ignore_marker || 'false' }}
        run: |
          ARGS=""
          if [ "$MODE" != "dry_run" ]; then ARGS="$ARGS --execute"; fi
          if [ "$IGNORE_MARKER" = "true" ]; then ARGS="$ARGS --ignore-marker"; fi
          echo "snapshot_archive args: $ARGS  (MODE=$MODE)"
          python snapshot_archive.py $ARGS
