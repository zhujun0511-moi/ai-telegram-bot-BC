name: TEMP · Bars Daily Archive + Trim (H)

# ⚠️⚠️ 臨時 workflow（2026-09-23）：BC.p 私有 repo 的 Actions 因帳單/額度被擋，
# 把它的每日 Mongo 瘦身歸檔臨時搬來公開的 BC（Actions 免費）頂著。
# 帳單修好後：整包刪除 bcp_temp/ + 這 4 個 temp_bcp_*.yml，BC.p 恢復原做。
# CFET 不在此列（用戶手動處理）。腳本從 BC.p 逐字複製（sha256 一致）、跑同一個 Mongo、
# 靠 Mongo marker 冪等，與 BC.p 版不會雙寫衝突。

on:
  schedule:
    - cron: "0 6 * * *"    # 同 BC.p 原排程 ~01:00-02:00 EST
  workflow_dispatch:
    inputs:
      mode:
        description: "full=archive+trim / archive_only=只存不裁 / dry_run=不寫不裁"
        required: false
        default: "full"
      keep:
        description: "Atlas H 熱層保留根數（預設 800）"
        required: false
        default: "800"
      keep_15m:
        description: "Atlas 15m 熱層保留根數（預設 400）"
        required: false
        default: "400"

permissions:
  contents: read

concurrency:
  group: temp-bcp-bars-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bars_archive (H -> dataset + trim Atlas)
        working-directory: bcp_temp
        env:
          MONGO_URI:        ${{ secrets.MONGO_URI }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:       ${{ secrets.HF_REPO_ID }}
          PYTHONUNBUFFERED: "1"
          MODE:             ${{ github.event.inputs.mode || 'full' }}
          KEEP:             ${{ github.event.inputs.keep || '800' }}
          KEEP_15M:         ${{ github.event.inputs.keep_15m || '400' }}
        run: |
          ARGS="--keep $KEEP --trim-15m --keep-15m $KEEP_15M"
          if [ "$MODE" != "dry_run" ]; then ARGS="$ARGS --execute"; fi
          if [ "$MODE" = "archive_only" ]; then ARGS="$ARGS --no-trim"; fi
          echo "bars_archive args: $ARGS  (MODE=$MODE)"
          python bars_archive.py $ARGS
